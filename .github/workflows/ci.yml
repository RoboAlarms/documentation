name: Validate docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate and build production image
        run: docker build --tag roboalarms-docs:ci .
      - name: Smoke-test production server
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name docs-ci --publish 127.0.0.1:8080:8080 roboalarms-docs:ci
          trap 'docker logs docs-ci; docker rm --force docs-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --output /tmp/docs-home.html http://127.0.0.1:8080/
          grep -q 'RoboAlarms' /tmp/docs-home.html
          curl --fail --silent http://127.0.0.1:8080/user/getting-started/ > /dev/null
          curl --fail --silent http://127.0.0.1:8080/images/panel/home-ready.png > /dev/null
          curl --fail --silent http://127.0.0.1:8080/pagefind/pagefind.js > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/not-a-docs-page/)" = '404'
          curl --fail --silent --head --output /tmp/docs-headers.txt http://127.0.0.1:8080/
          grep -qi 'X-Content-Type-Options: nosniff' /tmp/docs-headers.txt
          test "$(docker exec docs-ci id -u)" != '0'
